name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: go install helm.sh/helm/v4/cmd/helm@v4.3.0
      - run: ./scripts/test.sh
      - name: Build the CLI for preparation tests
        run: |
          go build -o /tmp/anvilctl ./cmd/anvilctl
          echo "ANVILCTL_PATH=/tmp/anvilctl" >> "$GITHUB_ENV"
      - run: python scripts/test-chart.py && python scripts/test-api-compatibility.py && python quickstart/test_quickstart.py
      - name: Install local API test assets
        run: |
          assets=$(go run sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20250517180713-32e5e9e948a5 use 1.37.0 --bin-dir /tmp/anvil-envtest -p path)
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - run: ANVIL_HELM_TEST=1 ./scripts/test-integration.sh
  cpu-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.26.5'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: docker build -t anvil.local/anvil-operator:cpu .
      - run: ./scripts/test-clean-cluster.sh anvil.local/anvil-operator:cpu /tmp/anvil-cpu-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-lifecycle-receipt
          path: /tmp/anvil-cpu-receipt.json
          if-no-files-found: error
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: '1.26.5'
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact=100 --no-banner --log-opts=--all .
