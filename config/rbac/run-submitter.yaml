# Bind this Role to an authenticated operator group in your own overlay.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anvil-run-submitter
rules:
  - apiGroups: [anvil.dev]
    resources: [trainingruns]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [anvil.dev]
    resources: [trainingrecipes]
    verbs: [get, list]
