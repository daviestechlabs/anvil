apiVersion: v1
kind: ServiceAccount
metadata:
  name: anvil-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil-operator
  labels:
    app.kubernetes.io/name: anvil-operator
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anvil-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil-operator
    spec:
      serviceAccountName: anvil-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # A release overlay must replace this with the published digest.
          image: anvil-operator:development
          args: ['--namespace=$(POD_NAMESPACE)', --leader-elect=true]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
