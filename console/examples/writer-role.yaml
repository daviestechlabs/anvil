# Optional: enable only after reviewing namespace-level submission privileges.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anvil-console-writer
  namespace: anvil
rules:
  - apiGroups: [anvil.dev]
    resources: [trainingruns]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anvil-console-writer
  namespace: anvil
subjects:
  - kind: ServiceAccount
    name: anvil-console
    namespace: anvil
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anvil-console-writer
